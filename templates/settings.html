{% extends "base.html" %}

{% block title %}Settings{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Settings</h2>
    <button class="save-btn" onclick="saveSettings()">
        <i class="bi bi-save"></i> Save Changes
    </button>
        </div>
        
<form id="settingsForm">
    <!-- Notification Settings -->
    <div class="settings-card">
        <h3 class="settings-title">Notification Settings</h3>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="emailNotifications" name="email_notifications" {% if settings.email_notifications %}checked{% endif %}>
            <label class="form-check-label" for="emailNotifications">
                Email Notifications
            </label>
                </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="appNotifications" name="app_notifications" {% if settings.app_notifications %}checked{% endif %}>
            <label class="form-check-label" for="appNotifications">
                In-App Notifications
            </label>
                </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="appointmentReminders" name="appointment_reminders" {% if settings.appointment_reminders %}checked{% endif %}>
            <label class="form-check-label" for="appointmentReminders">
                Appointment Reminders
            </label>
        </div>
    </div>

    <!-- Privacy & Security -->
    <div class="settings-card">
        <h3 class="settings-title">Privacy & Security</h3>
        <div class="mb-3">
            <label for="twoFactorAuth" class="form-label">Two-Factor Authentication</label>
            <select class="form-select" id="twoFactorAuth" name="two_factor_auth">
                <option value="disabled" {% if settings.two_factor_auth == 'disabled' %}selected{% endif %}>Disabled</option>
                <option value="email" {% if settings.two_factor_auth == 'email' %}selected{% endif %}>Email</option>
                <option value="authenticator" {% if settings.two_factor_auth == 'authenticator' %}selected{% endif %}>Authenticator App</option>
            </select>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" id="dataEncryption" name="data_encryption" {% if settings.data_encryption %}checked{% endif %}>
            <label class="form-check-label" for="dataEncryption">
                Enable Data Encryption
            </label>
                    </div>
                </div>

    <!-- Display Settings -->
    <div class="settings-card">
        <h3 class="settings-title">Display Settings</h3>
                    <div class="mb-3">
            <label for="theme" class="form-label">Theme</label>
            <select class="form-select" id="theme" name="theme">
                <option value="light" {% if settings.theme == 'light' %}selected{% endif %}>Light</option>
                <option value="dark" {% if settings.theme == 'dark' %}selected{% endif %}>Dark</option>
                <option value="system" {% if settings.theme == 'system' %}selected{% endif %}>System Default</option>
                        </select>
                    </div>
                    <div class="mb-3">
            <label for="fontSize" class="form-label">Font Size</label>
            <select class="form-select" id="fontSize" name="font_size">
                <option value="small" {% if settings.font_size == 'small' %}selected{% endif %}>Small</option>
                <option value="medium" {% if settings.font_size == 'medium' %}selected{% endif %}>Medium</option>
                <option value="large" {% if settings.font_size == 'large' %}selected{% endif %}>Large</option>
                        </select>
                </div>
            </div>

    <!-- Data Management -->
    <div class="settings-card">
        <h3 class="settings-title">Data Management</h3>
        <div class="mb-3">
            <label for="dataRetention" class="form-label">Data Retention Period</label>
            <select class="form-select" id="dataRetention" name="data_retention">
                <option value="30" {% if settings.data_retention == 30 %}selected{% endif %}>30 days</option>
                <option value="90" {% if settings.data_retention == 90 %}selected{% endif %}>90 days</option>
                <option value="180" {% if settings.data_retention == 180 %}selected{% endif %}>180 days</option>
                <option value="365" {% if settings.data_retention == 365 %}selected{% endif %}>1 year</option>
            </select>
                        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="autoBackup" name="auto_backup" {% if settings.auto_backup %}checked{% endif %}>
            <label class="form-check-label" for="autoBackup">
                Enable Automatic Backup
            </label>
        </div>
        <button type="button" class="btn btn-outline-danger" onclick="exportData()">
            <i class="bi bi-download"></i> Export All Data
        </button>
    </div>
</form>
{% endblock %}

{% block extra_js %}
    <script>
    // Set initial theme value from localStorage
    document.addEventListener('DOMContentLoaded', function() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.getElementById('theme').value = savedTheme;
    });

    function saveSettings() {
        const formData = {
            email_notifications: document.getElementById('emailNotifications').checked,
            app_notifications: document.getElementById('appNotifications').checked,
            appointment_reminders: document.getElementById('appointmentReminders').checked,
            two_factor_auth: document.getElementById('twoFactorAuth').value,
            data_encryption: document.getElementById('dataEncryption').checked,
            theme: document.getElementById('theme').value,
            font_size: document.getElementById('fontSize').value,
            data_retention: document.getElementById('dataRetention').value,
            auto_backup: document.getElementById('autoBackup').checked
        };

        // Apply theme immediately
        applyTheme(formData.theme);

        fetch('/api/settings', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showAlert('Settings saved successfully!', 'success');
            } else {
                showAlert('Error saving settings: ' + data.message, 'danger');
            }
        })
        .catch(error => {
            showAlert('Error saving settings: ' + error, 'danger');
            });
    }

    function applyTheme(theme) {
        // Apply theme to current page
        document.documentElement.setAttribute('data-theme', theme);
        // Store theme in localStorage
        localStorage.setItem('theme', theme);
        // Update global theme variable
        window.currentTheme = theme;
        // Trigger storage event for other pages
        window.dispatchEvent(new StorageEvent('storage', {
            key: 'theme',
            newValue: theme,
            oldValue: window.currentTheme,
            storageArea: localStorage
        }));
    }

    // Apply theme immediately when changed
    document.getElementById('theme').addEventListener('change', function() {
        applyTheme(this.value);
    });

    function exportData() {
        fetch('/api/settings/export-data')
            .then(response => response.blob())
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'carenest-data-export.zip';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error exporting data. Please try again.');
            });
    }

    function showAlert(message, type) {
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
        alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;
        document.querySelector('.header').prepend(alertDiv);
            }
    </script>
{% endblock %}
